name: Publish

# Publishes the packages one CI run built and tested: tags the commit, creates the GitHub Release and
# pushes to NuGet. Nothing is rebuilt; what ships is the `packages-<version>` artifact of that run.
#
# - A successful CI run of a push to `release/**` is published automatically.
# - Any other successful CI push run of `main` or `release/**` is published by hand:
#   `gh workflow run publish.yml -f run-id=<id of the CI run>`. That is how a -dev prerelease of main
#   reaches NuGet: a package for every merge had no consumer, so main is never published on its own.
#
# NuGet Trusted Publishing is bound to this file name (`publish.yml`) and the `nuget` environment; see
# docs/publishing.md#configure-nuget-trusted-publishing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      run-id:
        description: Id of the CI run to publish (the number in its URL, /actions/runs/<id>)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    # The trigger's branch filter also matches a pull request from a branch named release/*, so the
    # event and the conclusion are checked here. The gate on where this file runs from is the `nuget`
    # environment, which admits main only: workflow_run always runs main's copy, and a run started by
    # hand from another branch is refused there, loudly, so that branch's copy of this file cannot
    # obtain a NuGet key.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.conclusion == 'success'
        && startsWith(github.event.workflow_run.head_branch, 'release/'))
      || github.event_name == 'workflow_dispatch'
    # Publications run one at a time and queue rather than replace each other: two runs of one release
    # branch compute the same version and would otherwise race on one release.
    concurrency:
      group: publish
      queue: max
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run-id }}
    steps:
      - name: Resolve the CI run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid run id::'$SOURCE_RUN_ID' is not a run id. Use the number in the CI run's URL, /actions/runs/<id>."
            exit 1
          fi

          # The checks the workflow_run trigger already applies are repeated here for a run named by
          # hand: only a successful push build of this repository's CI, on main or a release branch,
          # carries a public version and has been through every job.
          # One field per unit separator (0x1f), which unlike a tab keeps an empty field in its place.
          FIELDS="$(gh api "repos/${GH_REPO}/actions/runs/${SOURCE_RUN_ID}" \
            --jq '[.path, .event, .conclusion, .head_branch, .head_repository.full_name, .head_sha] | map(. // "") | join("\u001f")')"
          IFS=$'\x1f' read -r WORKFLOW_PATH EVENT CONCLUSION BRANCH HEAD_REPO SHA <<<"$FIELDS"

          problems=()
          [[ "$WORKFLOW_PATH" == .github/workflows/ci.yml ]] || problems+=("it is a run of $WORKFLOW_PATH, not of ci.yml")
          [[ "$HEAD_REPO" == "$GH_REPO" ]] || problems+=("it built $HEAD_REPO, not $GH_REPO")
          [[ "$EVENT" == push ]] || problems+=("it was triggered by $EVENT, not by a push")
          [[ "$CONCLUSION" == success ]] || problems+=("its conclusion is $CONCLUSION, not success")
          [[ "$BRANCH" == main || "$BRANCH" == release/* ]] || problems+=("it built $BRANCH, not main or a release branch")
          if (( ${#problems[@]} > 0 )); then
            for problem in "${problems[@]}"; do
              echo "::error title=Run ${SOURCE_RUN_ID} cannot be published::${problem}."
            done
            exit 1
          fi

          ARTIFACT="$(gh api "repos/${GH_REPO}/actions/runs/${SOURCE_RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.name | startswith("packages-")) | select(.expired | not) | .name] | first // empty')"
          if [[ -z "$ARTIFACT" ]]; then
            echo "::error title=No packages to publish::Run ${SOURCE_RUN_ID} has no unexpired packages-<version> artifact (see retention-days in ci.yml). Re-run that CI run, or publish a newer one."
            exit 1
          fi
          VERSION="${ARTIFACT#packages-}"

          {
            echo "artifact=$ARTIFACT"
            echo "version=$VERSION"
            echo "sha=$SHA"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Publishing \`v${VERSION}\`"
            echo
            echo "From CI run [${SOURCE_RUN_ID}](${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${SOURCE_RUN_ID}), \`${BRANCH}\` at \`${SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.source.outputs.artifact }}
          path: packages
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the packages carry that version
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(packages/*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "::error title=No packages::The artifact holds no .nupkg."
            exit 1
          fi
          for pkg in "${packages[@]}"; do
            if [[ "$(basename "$pkg")" != *".${VERSION}.nupkg" ]]; then
              echo "::error title=Version mismatch::$(basename "$pkg") does not carry version ${VERSION}."
              exit 1
            fi
          done

      # `dotnet nuget push` below needs an SDK; there is no checkout, so no global.json selects one.
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: ga

      - name: Authenticate to NuGet
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.source.outputs.version }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          PRERELEASE=""
          [[ "$VERSION" == *-* ]] && PRERELEASE="--prerelease"

          # `gh release create` with assets is not one API call: gh's manual (Immutable Releases)
          # states it creates the release as a draft, uploads the assets, then publishes it. A run
          # interrupted mid-upload leaves an unpublished draft, which `gh release view` still finds
          # because its lookup queries drafts too. Reading that as an existing release would skip
          # the creation below and let Publish to NuGet run, putting packages on NuGet under a
          # version no one can see a release for — so the three states are told apart here. A
          # lookup that fails for any other reason reads as `missing` and falls through to
          # `gh release create`, which then fails loudly rather than skipping anything.
          RELEASE_STATE=missing
          if IS_DRAFT="$(gh release view "v${VERSION}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            RELEASE_STATE=published
            if [[ "$IS_DRAFT" == "true" ]]; then
              RELEASE_STATE=draft
            fi
          fi

          if [[ "$RELEASE_STATE" == draft ]]; then
            # Detection, not repair: publishing the draft and deleting it are both decisions about
            # what has already reached consumers, and untested recovery logic here is worse than
            # stopping.
            echo "::error title=Release v${VERSION} exists as an unpublished draft::A previous run created it and did not finish. Nothing was published by this run. Inspect the draft, then either publish it with the packages it is missing or delete it and run this workflow again."
            {
              echo "### Release \`v${VERSION}\` exists as an unpublished draft"
              echo
              echo "A previous run created the release and did not finish uploading its assets."
              echo "**Nothing was published by this run** — not the release, not NuGet."
              echo
              echo "Inspect the draft, then either publish it with the packages it is missing or"
              echo "delete it and run this workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # A release branch's version has no {height}, so every commit on it computes the same
          # number, and publishing one CI run twice does too. Creating the release twice is
          # therefore an ordinary occurrence rather than an error, and failing here would skip
          # Publish to NuGet for a run that had nothing wrong with it. So this path does nothing at
          # all — deliberately, and loudly.
          #
          # Nothing, rather than re-uploading: a published version is immutable on NuGet, so
          # replacing the release's assets would leave a direct GitHub download and a NuGet install
          # of the same version carrying different binaries, with the tag describing neither.
          # Whatever a later commit built cannot ship under this version; that needs a version bump.
          if [[ "$RELEASE_STATE" == published ]]; then
            echo "::warning title=Release v${VERSION} already exists::Its assets and tag are left untouched. NuGet still runs and will skip every version it already has — but it accepts one it is missing, which is how a partial push recovers. If this commit changed shipped code, it needs a new version (on a release branch, bump it; on main, the next commit raises it): the release's own assets will not be updated."
            {
              echo "### Release \`v${VERSION}\` already exists — left untouched"
              echo
              echo "Its assets and tag are unchanged. \`Publish to NuGet\` still runs: it skips every"
              echo "version already published, which is the normal outcome here, and uploads one that"
              echo "is missing, which is how a partially failed push recovers."
              echo
              echo "So a code change in this commit cannot reach consumers as \`${VERSION}\` through the"
              echo "release assets, and reaches NuGet only for a package NuGet does not yet have."
              echo "If the change is meant to ship, it needs a new version: bump it on a release branch;"
              echo "on main, the next commit raises it."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # --target is what makes the tag point at the commit that built these packages. Without
            # it, gh creates a missing tag from the latest state of the default branch, so the tag
            # would name main's head instead of the commit the CI run built.
            gh release create "v${VERSION}" packages/* \
              --title "v${VERSION}" \
              --target "${SHA}" \
              --generate-notes \
              $PRERELEASE
          fi

      - name: Publish to NuGet
        if: success()
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $source = 'https://api.nuget.org/v3/index.json'
          $apiKey = $env:NUGET_API_KEY
          $failedPackages = @()
          $failedSymbols = @()

          # --no-symbols: without it, pushing a .nupkg also pushes the adjacent .snupkg, and a symbol
          # endpoint failure would count a published package as failed. Symbols go in the loop below.
          foreach ($pkg in Get-ChildItem packages/*.nupkg) {
            Write-Host "Pushing $($pkg.Name)..."
            dotnet nuget push $pkg.FullName --api-key $apiKey --source $source --skip-duplicate --no-symbols 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Failed to push $($pkg.Name) (exit code $LASTEXITCODE) — continuing with remaining packages."
              $failedPackages += $pkg.Name
            }
          }

          foreach ($pkg in Get-ChildItem packages/*.snupkg -ErrorAction SilentlyContinue) {
            Write-Host "Pushing $($pkg.Name)..."
            dotnet nuget push $pkg.FullName --api-key $apiKey --source $source --skip-duplicate 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Failed to push $($pkg.Name) (exit code $LASTEXITCODE) — continuing with remaining packages."
              $failedSymbols += $pkg.Name
            }
          }

          # Every package of a version must reach NuGet, so one failed .nupkg fails the job. The
          # GitHub release already exists at this point; a green run would hide that consumers can
          # restore some packages of the version and not others. Re-running this workflow is the
          # recovery: --skip-duplicate passes over what was published and retries the rest.
          # A missing symbol package (.snupkg) degrades debugging only, so it stays a warning.
          if ($failedSymbols.Count -gt 0) {
            Write-Warning "These symbol packages failed to publish: $($failedSymbols -join ', ')"
          }
          if ($failedPackages.Count -gt 0) {
            Write-Host "::error title=NuGet publish incomplete::$($failedPackages.Count) package(s) failed to publish: $($failedPackages -join ', '). Re-run this workflow to push them; published packages are skipped."
            exit 1
          }
          # GitHub ends a pwsh step with the last native command's exit code, so a failed symbol push
          # that ran last would otherwise fail the job despite the warning above.
          exit 0
