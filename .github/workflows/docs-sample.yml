name: Documentation sample

on:
  pull_request:
    paths: ['samples/10-docs-mcp/**', 'samples/shared/**', 'src/**', '.github/workflows/docs-sample.yml', 'global.json', 'nuget.config']
  push:
    branches: [main]
    paths: ['samples/10-docs-mcp/**', 'samples/shared/**', 'src/**', '.github/workflows/docs-sample.yml', 'global.json', 'nuget.config']

permissions:
  contents: read

jobs:
  native:
    name: Documentation runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      DOCS_ASSETS: ${{ github.workspace }}/samples/10-docs-mcp/.assets
      DOCS_TEST_ASSETS: ${{ github.workspace }}/samples/10-docs-mcp/.assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: samples/10-docs-mcp/.assets
          key: docs-assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('samples/10-docs-mcp/assets.json') }}
      - name: Fetch and verify pinned assets
        run: dotnet run --project samples/10-docs-mcp/DocsMcpSample.csproj -c Release -- assets fetch
      - name: Test native index, model and transports
        run: dotnet test --project src/Repl.DocsSampleTests/Repl.DocsSampleTests.csproj -c Release --minimum-expected-tests 12

  container:
    name: Documentation container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --platform linux/amd64 -f samples/10-docs-mcp/Dockerfile -t docs-sample .
      - name: Exercise persistent index and live-process health
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs docs-sample; docker rm -f -v docs-sample' EXIT
          docker run -d --name docs-sample --network none \
            --mount type=bind,source="$PWD/samples/10-docs-mcp/documents",target=/documents,readonly \
            --mount type=volume,target=/index docs-sample
          ready() {
            for attempt in $(seq 1 60); do
              if docker exec docs-sample /app/docs-index health --ready; then return 0; fi
              sleep 2
            done
            return 1
          }
          ready
          docker exec docs-sample /app/docs-index exec docs search --query 'attach console'
          first=$(docker exec docs-sample /app/docs-index exec index status | jq -r '.generation.id')
          docker restart docs-sample
          ready
          second=$(docker exec docs-sample /app/docs-index exec index status | jq -r '.generation.id')
          test "$first" = "$second"
          test "$(docker inspect -f '{{.Config.User}}' docs-sample)" != '0'
